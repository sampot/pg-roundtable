<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#181020" />
    <meta name="description" content="多勢力密封出價與條約外交談判" />
    <title>圓桌協議</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="top">
        <div>
          <small>外交談判</small>
          <h1>圓桌協議</h1>
        </div>
        <button type="button" id="sound" aria-pressed="true" aria-label="切換音效">♫ 音效</button>
      </header>

      <section id="lobby" class="panel hero">
        <img src="./assets/images/emblem.png" width="96" height="96" alt="" class="sigil" />
        <p>六輪圓桌：對議程<strong>密封出價</strong>，並向三股勢力<strong>提案條約</strong>。人機為主，約 5–8 分鐘。</p>
        <p class="meta">最佳聲望 <strong id="best">0</strong></p>
        <button type="button" id="start" class="primary">開始新局</button>
        <button type="button" id="credits-open" class="ghost">製作與署名</button>
      </section>

      <section id="game" hidden>
        <div id="hud" class="hud" aria-live="polite"></div>
        <section id="board" class="board" aria-label="圓桌議程"></section>
        <p id="msg" class="msg" aria-live="polite"></p>
        <div id="bid-panel" class="bid-panel" hidden></div>
        <div id="treaty-panel" class="treaty-panel" hidden></div>
        <div id="actions" class="actions"></div>
      </section>

      <dialog id="credits" class="panel credits">
        <h2>製作與署名</h2>
        <p>玩法與程式：本專案。素材見 ATTRIBUTION.md。</p>
        <ul id="credit-list"></ul>
        <button type="button" id="credits-close" class="primary">關閉</button>
      </dialog>

      <div id="toast" class="toast" hidden role="status"></div>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
